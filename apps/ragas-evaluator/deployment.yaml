apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragas-evaluator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragas-evaluator
  template:
    metadata:
      labels:
        app: ragas-evaluator
    spec:
      containers:
      - name: ragas-evaluator
        image: localhost/ragas-evaluator:v4
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: OLLAMA_BASE_URL
          value: "http://ollama-service.ai-services.svc.cluster.local:11434"
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
