apiVersion: apps/v1
kind: Deployment
metadata:
  name: ragas-evaluator
  namespace: default
  labels:
    app: ragas-evaluator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ragas-evaluator
  template:
    metadata:
      labels:
        app: ragas-evaluator
    spec:
      containers:
      - name: ragas-evaluator
        image: python:3.11-slim
        env:
        - name: OLLAMA_BASE_URL
          value: "http://192.168.30.1:11434"
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --no-cache-dir fastapi uvicorn ragas langchain-ollama datasets pydantic pandas

          cat << 'EOF' > main.py
          import sys
          import os

          # 修复 VertexAI 缺失的 Mock 逻辑
          mock_mod = type("mock_mod", (), {"ChatVertexAI": None})
          sys.modules["langchain_community.chat_models.vertexai"] = mock_mod

          from fastapi import FastAPI
          from pydantic import BaseModel
          from ragas import evaluate
          from ragas.llms import LangchainLLMWrapper
          from langchain_ollama import ChatOllama, OllamaEmbeddings
          from datasets import Dataset

          app = FastAPI(title="Ragas Evaluator Service")
          OLLAMA_URL = os.getenv("OLLAMA_BASE_URL", "http://192.168.30.1:11434")

          class EvalRequest(BaseModel):
              question: str
              answer: str
              contexts: list[str]
              ground_truth: str

          @app.get("/health")
          def health():
              return {"status": "ok"}

          @app.post("/evaluate")
          def evaluate_api(req: EvalRequest):
              llm = ChatOllama(model="qwen2.5:1.5b", base_url=OLLAMA_URL)
              evaluator_llm = LangchainLLMWrapper(llm)
              embedding_model = OllamaEmbeddings(model="nomic-embed-text", base_url=OLLAMA_URL)

              data = {
                  "question": [req.question],
                  "answer": [req.answer],
                  "contexts": [req.contexts],
                  "ground_truth": [req.ground_truth]
              }
              dataset = Dataset.from_dict(data)

              result = evaluate(
                  dataset,
                  llm=evaluator_llm,
                  embeddings=embedding_model
              )
              
              # ✅ 修复：将 EvaluationResult 转为标准 Python dict 返回
              return dict(result)
          EOF

          uvicorn main:app --host 0.0.0.0 --port 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ragas-evaluator-service
  namespace: default
spec:
  selector:
    app: ragas-evaluator
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30080
  type: NodePort
